<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOLA — Arcade</title>
  
  <!-- App Icon & Logo -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231F1230'/><circle cx='50' cy='60' r='18' fill='%23FF6B5B'/><circle cx='50' cy='30' r='12' fill='%23C4F135'/><text x='50' y='92' font-size='22' font-weight='bold' fill='%23C4F135' text-anchor='middle'>KOLA</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231F1230'/><circle cx='50' cy='60' r='18' fill='%23FF6B5B'/><circle cx='50' cy='30' r='12' fill='%23C4F135'/><text x='50' y='92' font-size='22' font-weight='bold' fill='%23C4F135' text-anchor='middle'>KOLA</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#1F1230;
      --ink-2:#2A1A42;
      --cream:#F5EFE6;
      --lime:#C4F135;
      --coral:#FF6B5B;
      --teal:#1B8C82;
      --teal-dark:#0E5C56;
      --shadow:rgba(31,18,48,0.35);
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
    body{
      background:var(--ink);
      color:var(--cream);
      font-family:'Space Mono',monospace;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:1rem;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(196,241,53,0.08) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255,107,91,0.08) 0%, transparent 20%);
    }
    header{
      text-align:center;
      margin-bottom:1.5rem;
      margin-top:1rem;
    }
    .badge{
      display:inline-block;
      font-size:0.75rem;
      text-transform:uppercase;
      letter-spacing:2px;
      color:var(--lime);
      border:1px solid var(--lime);
      padding:2px 8px;
      border-radius:4px;
      margin-bottom:0.5rem;
    }
    h1{
      font-family:'Syne',sans-serif;
      font-size:3rem;
      font-weight:800;
      letter-spacing:-1px;
      color:var(--cream);
      text-shadow:3px 3px 0px var(--teal);
      line-height:1;
    }
    .tagline{
      font-size:0.85rem;
      opacity:0.8;
      margin-top:0.5rem;
      max-width:300px;
    }
    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--lime);
      color: var(--ink);
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 30px;
      text-decoration: none;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(196,241,53,0.3);
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }
    .dl-btn:active { transform: scale(0.95); }
    .nav-tabs{
      display:flex;
      gap:8px;
      background:var(--ink-2);
      padding:5px;
      border-radius:12px;
      margin-bottom:1.5rem;
    }
    .tab-btn{
      background:transparent;
      border:none;
      color:var(--cream);
      padding:8px 16px;
      font-family:inherit;
      font-size:0.8rem;
      font-weight:bold;
      border-radius:8px;
      cursor:pointer;
      opacity:0.6;
      transition:all 0.2s;
    }
    .tab-btn.active{
      background:var(--lime);
      color:var(--ink);
      opacity:1;
    }
    .arcade-cabinet{
      width:100%;
      max-width:360px;
      background:var(--ink-2);
      border:3px solid var(--teal);
      border-radius:20px;
      padding:15px;
      box-shadow:0 10px 30px var(--shadow);
    }
    .screen-header{
      display:flex;
      justify-content:space-between;
      font-size:0.7rem;
      color:var(--lime);
      margin-bottom:10px;
      padding:0 5px;
    }
    .screen{
      background:#0f0819;
      border-radius:12px;
      padding:15px;
      min-height:320px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      border:2px solid rgba(255,255,255,0.05);
      position:relative;
      overflow:hidden;
    }
    .game-panel{
      display:none;
      width:100%;
      height:100%;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }
    .game-panel.active{ display:flex; }
    
    /* Tic Tac Toe */
    .ttt-board{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:8px;
      width:210px;
      height:210px;
      margin-top:10px;
    }
    .ttt-cell{
      background:var(--ink-2);
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.8rem;
      font-weight:bold;
      cursor:pointer;
      color:var(--cream);
    }
    
    /* Memory Match */
    .mem-board{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:6px;
      width:220px;
      margin-top:10px;
    }
    .mem-card{
      aspect-ratio:1;
      background:var(--ink-2);
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.2rem;
      cursor:pointer;
    }

    /* Tap War */
    .tap-area{
      width:100%;
      height:120px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:1.2rem;
      margin:5px 0;
      cursor:pointer;
    }
    #p1-tap{ background:var(--coral); color:var(--cream); }
    #p2-tap{ background:var(--lime); color:var(--ink); }

    .status-text{
      font-size:0.85rem;
      margin-bottom:10px;
      text-align:center;
    }
    .reset-btn{
      margin-top:12px;
      background:transparent;
      border:1px solid var(--coral);
      color:var(--coral);
      padding:6px 14px;
      border-radius:6px;
      font-family:inherit;
      font-size:0.75rem;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Insert Coin</div>
    <h1>KOLA</h1>
    <p class="tagline">A tiny arcade for taking a break. Pick a cabinet, hit play — <strong style="color:var(--coral)">no download, no login.</strong></p>
    <button onclick="downloadSelf()" class="dl-btn">
      📥 Download Offline Game
    </button>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchGame('ttt')">TIC TAC TOE</button>
    <button class="tab-btn" onclick="switchGame('mem')">MEMORY MATCH</button>
    <button class="tab-btn" onclick="switchGame('tap')">TAP WAR · 2P</button>
  </div>

  <div class="arcade-cabinet">
    <div class="screen-header">
      <span>● ON AIR</span>
      <span id="cab-id">CAB-01 · TTT</span>
    </div>
    
    <div class="screen">
      <!-- TIC TAC TOE -->
      <div id="game-ttt" class="game-panel active">
        <div class="status-text" id="ttt-status">Your turn — you're X</div>
        <div class="ttt-board" id="ttt-board"></div>
        <button class="reset-btn" onclick="initTTT()">Restart Game</button>
      </div>

      <!-- MEMORY MATCH -->
      <div id="game-mem" class="game-panel">
        <div class="status-text" id="mem-status">Find matching pairs!</div>
        <div class="mem-board" id="mem-board"></div>
        <button class="reset-btn" onclick="initMem()">Restart Game</button>
      </div>

      <!-- TAP WAR -->
      <div id="game-tap" class="game-panel">
        <div class="status-text" id="tap-status">First to 15 taps wins!</div>
        <div class="tap-area" id="p1-tap" onclick="tap(1)">P1: <span id="p1-score">0</span></div>
        <div class="tap-area" id="p2-tap" onclick="tap(2)">P2: <span id="p2-score">0</span></div>
        <button class="reset-btn" onclick="initTap()">Reset Scores</button>
      </div>
    </div>
  </div>

  <script>
    /* AUTOMATIC FILE DOWNLOADER */
    function downloadSelf() {
      const pageHTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([pageHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'KOLA_Offline_Game.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function switchGame(type){
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('game-' + type).classList.add('active');
      
      const cabMap = {ttt:'CAB-01 · TTT', mem:'CAB-02 · MEM', tap:'CAB-03 · TAP'};
      document.getElementById('cab-id').innerText = cabMap[type];
    }

    /* TIC TAC TOE CODE */
    let tttState = Array(9).fill(null);
    function initTTT(){
      tttState = Array(9).fill(null);
      document.getElementById('ttt-status').innerText = "Your turn — you're X";
      const board = document.getElementById('ttt-board');
      board.innerHTML = '';
      for(let i=0; i<9; i++){
        const cell = document.createElement('div');
        cell.className = 'ttt-cell';
        cell.onclick = () => playTTT(i);
        board.appendChild(cell);
      }
    }
    function playTTT(i){
      if(tttState[i] || checkTTTWinner(tttState)) return;
      tttState[i] = 'X';
      renderTTT();
      if(!checkTTTWinner(tttState) && tttState.includes(null)){
        setTimeout(botTTT, 300);
      }
    }
    function botTTT(){
      let empty = tttState.map((v,i)=>v===null?i:null).filter(v=>v!==null);
      if(empty.length > 0){
        let move = empty[Math.floor(Math.random()*empty.length)];
        tttState[move] = 'O';
        renderTTT();
      }
    }
    function renderTTT(){
      const board = document.getElementById('ttt-board');
      tttState.forEach((val, i) => {
        board.children[i].innerText = val || '';
        if(val === 'X') board.children[i].style.color = 'var(--lime)';
        if(val === 'O') board.children[i].style.color = 'var(--coral)';
      });
      let win = checkTTTWinner(tttState);
      if(win){
        document.getElementById('ttt-status').innerText = win === 'X' ? '🎉 You Won!' : '🤖 Bot Won!';
      } else if(!tttState.includes(null)){
        document.getElementById('ttt-status').innerText = "It's a Draw!";
      }
    }
    function checkTTTWinner(b){
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(let [a,b,c] of lines){
        if(tttState[a] && tttState[a] === tttState[b] && tttState[a] === tttState[c]) return tttState[a];
      }
      return null;
    }

    /* MEMORY MATCH CODE */
    const icons = ['🎮','🕹️','👾','🎲','🎯','🎨'];
    let memCards = [], flipped = [], matched = 0;
    function initMem(){
      memCards = [...icons, ...icons].sort(() => Math.random() - 0.5);
      flipped = []; matched = 0;
      document.getElementById('mem-status').innerText = "Find matching pairs!";
      const board = document.getElementById('mem-board');
      board.innerHTML = '';
      memCards.forEach((icon, i) => {
        const card = document.createElement('div');
        card.className = 'mem-card';
        card.dataset.icon = icon;
        card.onclick = () => flipMem(card, i);
        board.appendChild(card);
      });
    }
    function flipMem(card, i){
      if(flipped.length < 2 && !card.innerText){
        card.innerText = card.dataset.icon;
        flipped.push({card, i});
        if(flipped.length === 2){
          if(flipped[0].card.dataset.icon === flipped[1].card.dataset.icon){
            matched++;
            flipped = [];
            if(matched === 6) document.getElementById('mem-status').innerText = "🎉 All Matched!";
          } else {
            setTimeout(() => {
              flipped[0].card.innerText = '';
              flipped[1].card.innerText = '';
              flipped = [];
            }, 600);
          }
        }
      }
    }

    /* TAP WAR CODE */
    let p1 = 0, p2 = 0;
    function initTap(){
      p1 = 0; p2 = 0;
      document.getElementById('p1-score').innerText = 0;
      document.getElementById('p2-score').innerText = 0;
      document.getElementById('tap-status').innerText = "First to 15 taps wins!";
    }
    function tap(p){
      if(p1 >= 15 || p2 >= 15) return;
      if(p===1) p1++; else p2++;
      document.getElementById('p1-score').innerText = p1;
      document.getElementById('p2-score').innerText = p2;
      if(p1 >= 15) document.getElementById('tap-status').innerText = "🔥 Player 1 Wins!";
      if(p2 >= 15) document.getElementById('tap-status').innerText = "⚡ Player 2 Wins!";
    }

    initTTT();
    initMem();
    initTap();
  </scr
